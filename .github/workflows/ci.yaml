name: ci

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: Test Node runtime
        run: npm test

      - name: Test Workers runtime
        run: npm run test:worker

      - name: Audit dependencies
        run: npm audit

      - name: Check Worker bundle
        run: npm run deploy -- --name dry-run --dry-run --outdir .wrangler-dist

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: loungekey-pkpass:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-worker:
    name: Deploy Cloudflare Worker
    if: github.event_name == 'push'
    needs:
      - test
      - docker
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - name: Trigger Cloudflare deployment
        env:
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          test -n "$DEPLOY_HOOK"
          curl --fail --silent --show-error --request POST "$DEPLOY_HOOK"
